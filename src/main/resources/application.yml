# ─── WS Gateway Configuration ─────────────────────────────────────────
ws:
  gateway:
    transport: http                    # "http" (default, production) or "stdio" (dev/Claude Desktop)
    auth:
      enabled: false                   # Set true to enable gateway API key auth on /mcp
      api-key: ""                      # Only used when auth.enabled=true
    session:
      idle-timeout-minutes: 10         # Mark session DISCONNECTED after this idle duration (safe with response-completion activity updates)
      reaper-interval-seconds: 30      # How often the reaper runs (30s for faster zombie cleanup)
      reaper-enabled: true             # Master switch to disable reaper
    southbound:
      health-check-interval-seconds: 120  # How often to check southbound server health
      health-check-enabled: true
      auto-reconnect: true
      max-reconnect-attempts: 3
    server-config-encryption:
      key: ${WS_GATEWAY_SERVER_CONFIG_ENCRYPTION_KEY:}
    pdp:
      anthropic-api-key: ${WS_GATEWAY_ANTHROPIC_API_KEY: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}   # Anthropic API key for LLM policy generation

# ─── NOTE ────────────────────────────────────────────────────────────
